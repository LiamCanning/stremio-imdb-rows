name: Weekly build
on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "imdb-rows-bot"
          git config user.email "imdb-rows-bot@users.noreply.github.com"
          git add -A docs cache
          git commit -m "Weekly rebuild $(date -u +%F)" || echo "No changes"
          git push
      # Watchlist and episode ratings (~250k files) go to Pages, never committed
      - name: Assemble site
        run: |
          cp -r docs _site
          python watchlist.py _site
          python episodes.py _site
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
